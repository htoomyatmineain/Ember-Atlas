services:
  - type: web
    name: ember-atlas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
